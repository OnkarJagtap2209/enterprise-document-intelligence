[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-document-intelligence"
version = "0.1.0"
description = "An enterprise-style hybrid RAG system for financial documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["docling>=2.122.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
