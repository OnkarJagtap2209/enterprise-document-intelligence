[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-document-intelligence"
version = "0.1.0"
description = "An enterprise-style hybrid RAG system for financial documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9,<2",
    "docling>=2.122.0,<3",
    "sentence-transformers>=6.0.0,<7",
    "fastapi>=0.115.0,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30.0,<1",
    "streamlit>=1.40.0,<2",
    "google-genai>=1.75.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
